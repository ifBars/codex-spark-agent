[package]
name = "codex-spark-agent"
version = "0.9.2"
edition = "2024"
description = "Experimental Rust CLI harness for GPT-5.3-Codex-Spark over the ChatGPT Codex backend"
license = "MIT"
repository = "https://github.com/ifBars/codex-spark-agent"
readme = "README.md"
keywords = ["codex", "openai", "agent", "cli", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "spark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["osc52"] }
open = "5"
pulldown-cmark = "0.13.4"
rand = "0.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tempfile = "3"
throbber-widgets-tui = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "process"] }
toml = "0.9"
url = "2"
urlencoding = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
directories = "6.0.0"
inquire = "0.9.4"
comfy-table = "7.2.2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

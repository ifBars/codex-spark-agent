<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Reasoning cost-quality pilot</title>
  <desc id="desc">Weighted validation quality versus total API tokens for the Spark harness and Codex CLI at low, medium, and high reasoning. One stateful task was run once per level. Filled markers passed every check; hollow markers were incomplete.</desc>
  <rect width="960" height="600" rx="16" fill="#0d1117"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="44" y="46" fill="#f0f6fc" font-size="24" font-weight="600">Reasoning cost-quality pilot</text>
    <text x="44" y="72" fill="#8b949e" font-size="14">GPT-5.3 Codex Spark - granular behavioral scoring - 1 task x 1 run per level</text>
    <g font-size="14" fill="#f0f6fc">
      <line x1="618" y1="43" x2="652" y2="43" stroke="#58a6ff" stroke-width="3"/><circle cx="635" cy="43" r="5" fill="#58a6ff"/><text x="662" y="48">Spark harness</text>
      <line x1="618" y1="68" x2="652" y2="68" stroke="#ff7b72" stroke-width="3"/><rect x="630" y="63" width="10" height="10" rx="1" fill="#ff7b72"/><text x="662" y="73">Codex CLI</text>
    </g>
    <g stroke="#30363d" stroke-width="1">
      <line x1="116" y1="455" x2="900" y2="455"/><line x1="116" y1="389" x2="900" y2="389"/><line x1="116" y1="323" x2="900" y2="323"/>
      <line x1="116" y1="257" x2="900" y2="257"/><line x1="116" y1="191" x2="900" y2="191"/><line x1="116" y1="125" x2="900" y2="125"/>
    </g>
    <g fill="#8b949e" font-size="13">
      <text x="101" y="460" text-anchor="end">0</text><text x="101" y="394" text-anchor="end">20</text><text x="101" y="328" text-anchor="end">40</text>
      <text x="101" y="262" text-anchor="end">60</text><text x="101" y="196" text-anchor="end">80</text><text x="101" y="130" text-anchor="end">100</text>
      <text x="116" y="481" text-anchor="middle">100k</text><text x="312" y="481" text-anchor="middle">150k</text><text x="508" y="481" text-anchor="middle">200k</text>
      <text x="704" y="481" text-anchor="middle">250k</text><text x="900" y="481" text-anchor="middle">300k</text>
    </g>
    <g stroke="#6e7681" stroke-width="1.5">
      <line x1="116" y1="105" x2="116" y2="455"/><line x1="116" y1="455" x2="900" y2="455"/>
      <line x1="116" y1="455" x2="116" y2="462"/><line x1="312" y1="455" x2="312" y2="462"/><line x1="508" y1="455" x2="508" y2="462"/>
      <line x1="704" y1="455" x2="704" y2="462"/><line x1="900" y1="455" x2="900" y2="462"/>
    </g>
    <text x="508" y="518" fill="#f0f6fc" font-size="14" text-anchor="middle">Total API tokens for the task-run (input + output)</text>
    <text x="31" y="288" fill="#f0f6fc" font-size="14" text-anchor="middle" transform="rotate(-90 31 288)">Weighted validation quality</text>
    <path d="M157 455 L206 175 L472 125" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M294 241 L190 257 L830 125" fill="none" stroke="#ff7b72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#58a6ff" stroke-width="3">
      <circle cx="157" cy="455" r="7" fill="#0d1117"/><path d="M206 166 L215 175 L206 184 L197 175 Z" fill="#0d1117"/><path d="M472 114 L483 135 H461 Z" fill="#58a6ff"/>
    </g>
    <g stroke="#ff7b72" stroke-width="3">
      <circle cx="294" cy="241" r="7" fill="#0d1117"/><path d="M190 248 L199 257 L190 266 L181 257 Z" fill="#0d1117"/><path d="M830 114 L841 135 H819 Z" fill="#ff7b72"/>
    </g>
    <g fill="#f0f6fc" font-size="13">
      <text x="145" y="438" text-anchor="end">low - 0</text><text x="218" y="163">medium - 85</text><text x="458" y="112" text-anchor="end">high - 100</text>
      <text x="306" y="229">low - 65</text><text x="178" y="279" text-anchor="end">medium - 60</text><text x="816" y="112" text-anchor="end">high - 100</text>
    </g>
    <g fill="#8b949e" font-size="12">
      <text x="44" y="554">Markers: circle low - diamond medium - triangle high</text><text x="916" y="554" text-anchor="end">filled = all checks passed - hollow = incomplete</text>
      <text x="480" y="578" text-anchor="middle">Pilot only: one difficult stateful task and no confidence intervals; expand before generalizing.</text>
    </g>
  </g>
</svg>
